name: Build Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: easytshark-frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Install Wireshark runtime
        shell: pwsh
        run: choco install wireshark -y --no-progress

      - name: Install Npcap SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'npcap-sdk.zip'
          $sdk = Join-Path $env:RUNNER_TEMP 'npcap-sdk'
          Invoke-WebRequest 'https://npcap.com/dist/npcap-sdk-1.15.zip' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $sdk -Force
          $header = Get-ChildItem $sdk -File -Recurse -Filter pcap.h | Select-Object -First 1
          if (!$header) { throw 'Npcap SDK headers were not found' }
          $root = $header.Directory.Parent
          "NPCAP_SDK=$($root.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Prepare Wireshark resources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $wireshark = Join-Path $env:ProgramFiles 'Wireshark'
          if (!(Test-Path (Join-Path $wireshark 'tshark.exe'))) {
            throw "Wireshark installation not found at $wireshark"
          }
          $destination = Join-Path $PWD 'easytshark-frontend/resources/tshark_win/tshark/bin'
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Copy-Item (Join-Path $wireshark '*') -Destination $destination -Recurse -Force

      - name: Build native capture server
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $PWD 'easytshark-server-cpp'
          foreach ($file in @(
            (Join-Path $source 'tshark_server/third_library/ip2region/xdb_bench.cc'),
            (Join-Path $source 'tshark_server/third_library/ip2region/xdb_search.cc')
          )) {
            $text = Get-Content $file -Raw
            $text = $text.Replace("#include <windows.h>`r`n#include <winsock2.h>", "#include <winsock2.h>`r`n#include <windows.h>")
            $text = $text.Replace("#include <windows.h>`n#include <winsock2.h>", "#include <winsock2.h>`n#include <windows.h>")
            Set-Content -Path $file -Value $text -NoNewline
          }
          $build = Join-Path $source 'build'
          $include = Join-Path $env:NPCAP_SDK 'Include'
          $lib = Join-Path $env:NPCAP_SDK 'Lib/x64'
          cmake -S $source -B $build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_CXX_FLAGS=/I`"$include`"" "-DCMAKE_EXE_LINKER_FLAGS=/LIBPATH:`"$lib`""
          cmake --build $build --config Release --parallel
          $server = Join-Path $build 'tshark_server.exe'
          if (!(Test-Path $server)) { throw "Missing native server: $server" }
          New-Item -ItemType Directory -Force -Path 'easytshark-frontend/resources/tshark_win' | Out-Null
          Copy-Item $server 'easytshark-frontend/resources/tshark_win/tshark_server.exe' -Force

      - name: Install frontend dependencies
        working-directory: easytshark-frontend
        run: npm ci

      - name: Build Windows installer
        working-directory: easytshark-frontend
        shell: pwsh
        run: npm run tauri-build-win

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: easytshark-windows-installer
          if-no-files-found: error
          path: easytshark-frontend/src-tauri/target/release/bundle/nsis/*setup.exe

      - name: Upload Windows application bundle
        uses: actions/upload-artifact@v4
        with:
          name: easytshark-windows-app
          if-no-files-found: error
          path: easytshark-frontend/src-tauri/target/release/bundle/nsis-staging
